[package]
name = "hope-shell"
version = "0.1.0"
edition = "2021"
authors = ["Lévy <levy.vs@gmail.com>"]
description = "Hope OS Shell — Wayland compositor wrapper with Deep Space theme"
license = "MIT"

[[bin]]
name = "hope-shell"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
which = "7"
