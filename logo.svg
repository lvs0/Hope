<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="#0F0F12"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="120" x2="400" y2="120" stroke="#1a1a2e" stroke-width="0.5"/>
  <line x1="0" y1="360" x2="400" y2="360" stroke="#1a1a2e" stroke-width="0.5"/>

  <!-- Icon: H letterform - geometric space station style -->
  <g transform="translate(100, 60)" filter="url(#glow-soft)">
    <!-- Outer frame -->
    <path d="M0,0 L100,0 L100,20 L20,20 L20,80 L100,80 L100,100 L0,100 Z" fill="url(#g1)" opacity="0.9"/>
    <!-- Inner cut - creates H shape -->
    <rect x="35" y="20" width="30" height="60" fill="#0F0F12"/>
    <!-- Left vertical bar -->
    <rect x="0" y="0" width="15" height="100" fill="url(#g1)"/>
    <!-- Right vertical bar -->
    <rect x="85" y="0" width="15" height="100" fill="url(#g1)"/>
    <!-- Cross bar -->
    <rect x="15" y="42" width="70" height="16" fill="url(#g1)"/>
  </g>

  <!-- Decorative orbits around H -->
  <ellipse cx="200" cy="130" rx="120" ry="30" fill="none" stroke="url(#g2)" stroke-width="1" opacity="0.3" transform="rotate(-15 200 130)"/>
  <ellipse cx="200" cy="130" rx="140" ry="35" fill="none" stroke="#4F46E5" stroke-width="0.5" opacity="0.2" transform="rotate(10 200 130)"/>

  <!-- Glowing accent dots -->
  <circle cx="100" cy="60" r="4" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="300" cy="60" r="4" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="100" cy="200" r="4" fill="#7C3AED" filter="url(#glow)"/>
  <circle cx="300" cy="200" r="4" fill="#7C3AED" filter="url(#glow)"/>

  <!-- Connection lines -->
  <line x1="104" y1="60" x2="296" y2="60" stroke="#06B6D4" stroke-width="0.5" opacity="0.4"/>
  <line x1="104" y1="200" x2="296" y2="200" stroke="#7C3AED" stroke-width="0.5" opacity="0.4"/>

  <!-- HOPE text -->
  <text x="200" y="290" text-anchor="middle" font-family="'DM Mono', 'Courier New', monospace" font-size="52" font-weight="700" letter-spacing="20" fill="#F0F0FF">HOPE</text>

  <!-- OS subtitle -->
  <text x="200" y="315" text-anchor="middle" font-family="'DM Mono', 'Courier New', monospace" font-size="14" font-weight="400" letter-spacing="12" fill="#06B6D4" opacity="0.8">OPERATING SYSTEM</text>

  <!-- Separator line -->
  <line x1="120" y1="335" x2="280" y2="335" stroke="url(#g2)" stroke-width="1" opacity="0.5"/>

  <!-- Tagline -->
  <text x="200" y="365" text-anchor="middle" font-family="'DM Mono', 'Courier New', monospace" font-size="11" font-weight="300" letter-spacing="2" fill="#6B7280">"Your digital life, under your control"</text>

  <!-- Version -->
  <text x="200" y="420" text-anchor="middle" font-family="'DM Mono', 'Courier New', monospace" font-size="9" letter-spacing="4" fill="#4B5563">v0.1 · ALPHA</text>

  <!-- Bottom decorative bar -->
  <rect x="80" y="440" width="240" height="1" fill="url(#g1)" opacity="0.3"/>

  <!-- Hex pattern decoration -->
  <g opacity="0.15">
    <polygon points="50,450 60,445 60,455" fill="#4F46E5"/>
    <polygon points="350,450 340,445 340,455" fill="#4F46E5"/>
  </g>

  <!-- Small orbit dots -->
  <circle cx="80" cy="130" r="2" fill="#06B6D4" opacity="0.6"/>
  <circle cx="320" cy="130" r="2" fill="#06B6D4" opacity="0.6"/>
</svg>