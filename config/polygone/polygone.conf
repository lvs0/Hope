# Hope OS Polygone configuration
# Polygone network integration for Hope OS

[polygone]
# Network enabled by default
enabled = true

# Node type: full, light, compute
node-type = "full"

# Sync interval (minutes)
sync-interval = 15

# E2E encryption for Hope Sync
e2e-encryption = true

[polygone.hope-sync]
# File synchronization between Hope nodes
enabled = true
sync-folders = ["~/Documents", "~/Pictures"]
exclude-patterns = ["*.tmp", ".git/*", "node_modules/*"]

[polygone.compute]
# Distributed LLM inference
enabled = true
# Share compute when idle
share-when-idle = true
# Max memory usage for inference (GB)
max-memory-gb = 4

[polygone.cast]
# Screen and audio sharing
enabled = true
# Target quality: 720p, 1080p, 4k
quality = "1080p"
# Max bitrate (Mbps)
max-bitrate = 25

[polygone.dev-sharing]
# Port forwarding without ngrok
enabled = true
# Default port range
port-range = "8000-9000"
