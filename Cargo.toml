[workspace]
resolver = "2"
members = [
    "hal",
    "hope-shell",
    "hope-mind",
    "hope-vault",
    "hope-voice",
    "hope-spotlight",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lévy <levy.vs@gmail.com>"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
