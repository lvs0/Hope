# Hope OS sysctl configuration
# Applied at boot for performance and security

# Kernel
kernel.sysrq = 0
kernel.panic = 60

# Memory
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# Network
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ZRAM (if enabled)
vm.zram_ratio = 0.5