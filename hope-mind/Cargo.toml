[package]
name = "hope-mind"
version = "0.1.0"
edition = "2021"
authors = ["Lévy <levy.vs@gmail.com>"]
description = "Hope OS Mind — Local AI integration via Ollama"
license = "MIT"

[[bin]]
name = "hope-mind"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
sysinfo = "0.34"
futures = "0.3"
